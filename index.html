<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>網路學系 規設同仁培訓課表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#05080f;--bg2:#0a101e;--panel:rgba(16,24,42,.72);--line:rgba(120,180,255,.14);
  --txt:#dce8ff;--dim:#93a3c4;--accent:#00e5ff;--r:14px}
/* 程度分級色（卡片左邊條、卡片上的分級標籤、彈窗標籤、圖例共用同一組變數） */
.lvb{--lv:#3ddc84;--lvbg:rgba(61,220,132,.12);--lvbd:rgba(61,220,132,.42)}
.lva{--lv:#ffb648;--lvbg:rgba(255,182,72,.12);--lvbd:rgba(255,182,72,.42)}
.lvp{--lv:#ff7aa2;--lvbg:rgba(255,122,162,.12);--lvbd:rgba(255,122,162,.44)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);overflow-x:hidden;
  font:16px/1.6 "Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
.grid-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(rgba(0,229,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,255,.025) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 78%);
  mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 78%)}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  padding:16px 32px;border-bottom:1px solid var(--line);backdrop-filter:blur(8px);
  background:linear-gradient(180deg,rgba(8,13,26,.9),rgba(8,13,26,.55))}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:40px;height:40px;border-radius:10px;flex:none;position:relative;
  background:conic-gradient(from 210deg,#00e5ff,#2f7bff,#7c6cff,#00e5ff);
  box-shadow:0 0 22px rgba(0,229,255,.45)}
.mark::after{content:"";position:absolute;inset:3px;border-radius:8px;background:var(--bg);
  background-image:radial-gradient(circle at 30% 30%,rgba(0,229,255,.5),transparent 60%)}
h1{margin:0;font-size:18px;font-weight:900;letter-spacing:1px;line-height:1.35}
h1 .en{display:block;font-family:"Rajdhani","Noto Sans TC",sans-serif;font-size:11px;font-weight:600;
  letter-spacing:4px;color:var(--accent);text-transform:uppercase}
.nb{display:inline-block}
main{position:relative;z-index:1;max-width:1360px;margin:0 auto;padding:26px 20px 56px}
.sub{color:var(--dim);font-size:13.5px;letter-spacing:.5px}
.filters{background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);
  border-radius:var(--r);padding:16px 18px}
input[type=search]{font:inherit;font-size:14px;width:100%;padding:10px 16px;border-radius:999px;
  border:1px solid var(--line);background:rgba(10,18,34,.8);color:var(--txt);margin-bottom:10px;
  outline:none;transition:.25s}
input[type=search]::placeholder{color:#8294b8}
input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,229,255,.12)}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0}
.frow>span:first-child{font-family:"Rajdhani","Noto Sans TC",sans-serif;font-weight:700;font-size:13px;
  letter-spacing:3px;color:var(--dim);min-width:3.4em}
.chip{font:inherit;font-size:13px;letter-spacing:1px;padding:7px 16px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--dim);cursor:pointer;transition:.25s}
.chip:hover{color:var(--txt);border-color:rgba(120,180,255,.38)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#03121c;font-weight:700;
  box-shadow:0 4px 22px rgba(0,229,255,.25)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;box-shadow:0 0 0 5px rgba(0,229,255,.12)}
.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:12.5px;color:var(--dim);letter-spacing:1px;margin:22px 0 12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
.dot.lvb,.dot.lva,.dot.lvp{background:var(--lv);box-shadow:0 0 8px var(--lvbd)}
.dot.done{background:transparent;border:1px solid var(--dim)}
.map{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:12px;align-items:start}
.col{display:flex;flex-direction:column;gap:9px;animation:fadeIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.head{position:relative;overflow:hidden;border:1px solid var(--c);border-radius:12px;
  padding:14px 10px;text-align:center;color:var(--txt);
  background:linear-gradient(160deg,var(--g),rgba(11,17,33,.92) 70%)}
.head::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c);box-shadow:0 0 14px var(--c)}
.head b{display:block;font-size:16px;font-weight:900;letter-spacing:1px;line-height:1.35}
.c0{--c:#8b7cff;--g:rgba(139,124,255,.18)}
.c1{--c:#ff7a4d;--g:rgba(255,122,77,.18)}
.c2{--c:#4da3ff;--g:rgba(77,163,255,.18)}
.c3{--c:#2fd6a0;--g:rgba(47,214,160,.18)}
.c4{--c:#ffb648;--g:rgba(255,182,72,.18)}
.c5{--c:#9aa8c0;--g:rgba(154,168,192,.18)}
.blk{text-align:left;font:inherit;color:var(--txt);cursor:pointer;background:rgba(14,21,40,.62);
  border:1px solid var(--line);border-left:3px solid var(--lv,var(--dim));border-radius:10px;padding:10px 12px;transition:.22s}
.blk:hover{background:rgba(255,255,255,.055);border-color:rgba(120,180,255,.3);transform:translateX(4px)}
.blk.done{background:rgba(12,18,34,.5)}
.blk.done .t{font-weight:500}
.blk.done .lvtag{opacity:.75}
.blk .t{font-size:14px;font-weight:700;line-height:1.45}
.blk .when{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px;
  margin-top:5px;font-size:12px;color:var(--dim);letter-spacing:.5px}
.lvtag{flex:none;font-size:11px;font-weight:700;letter-spacing:1px;padding:2px 9px;border-radius:999px;
  color:var(--lv);background:var(--lvbg);border:1px solid var(--lvbd)}
.tag{display:inline-block;font-size:11.5px;letter-spacing:1px;padding:3px 10px;border-radius:999px;
  margin:2px 5px 2px 0;border:1px solid var(--line);color:var(--dim)}
.g0{color:#8ec8ff;border-color:rgba(142,200,255,.42);background:rgba(142,200,255,.1)}
.g1{color:#3ddc84;border-color:rgba(61,220,132,.4);background:rgba(61,220,132,.1)}
.g2{color:#00e5ff;border-color:rgba(0,229,255,.42);background:rgba(0,229,255,.08)}
.tag.lvb,.tag.lva,.tag.lvp{color:var(--lv);background:var(--lvbg);border-color:var(--lvbd)}
.new{color:#ffd166;border-color:rgba(255,209,102,.46);background:rgba(255,209,102,.1);animation:newpulse 2.2s infinite}
@keyframes newpulse{50%{box-shadow:0 0 12px rgba(255,209,102,.35)}}
.empty{color:var(--dim);font-size:13px;letter-spacing:1px;padding:14px 0;text-align:center}
dialog{border:1px solid var(--line);border-radius:var(--r);padding:0;max-width:780px;
  width:calc(100% - 32px);background:rgba(10,16,30,.97);color:var(--txt);
  backdrop-filter:blur(10px);box-shadow:0 18px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(2,5,12,.74)}
.dlg{padding:22px 26px}
.dlg h3{margin:0 0 6px;font-size:21px;font-weight:900;letter-spacing:1px}
.close{float:right;font:inherit;font-size:22px;line-height:1;background:rgba(255,255,255,.03);
  border:1px solid var(--line);border-radius:8px;color:var(--dim);cursor:pointer;padding:2px 10px;transition:.2s}
.close:hover{color:var(--accent);border-color:var(--accent)}
.sec{margin-top:18px}
.sec h4{margin:0 0 8px;font-size:15px;font-weight:900;letter-spacing:2px;display:flex;align-items:center;gap:12px}
.sec h4::before{content:"";flex:none;width:20px;height:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.runs{padding-left:1.3em}
.runs li{margin:3px 0}
.note{font-size:13px;color:var(--dim)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:8px;border-top:1px solid var(--line);vertical-align:top}
.tbl th{font-family:"Rajdhani","Noto Sans TC",sans-serif;font-weight:700;font-size:12.5px;
  letter-spacing:2px;color:var(--dim);white-space:nowrap}
.wrap{overflow-x:auto}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.btn{display:inline-block;font-size:13.5px;letter-spacing:1px;padding:9px 18px;border-radius:999px;
  border:1px solid var(--accent);color:var(--accent);text-decoration:none;background:rgba(0,229,255,.07);transition:.25s}
.btn:hover{background:rgba(0,229,255,.16);box-shadow:0 4px 22px rgba(0,229,255,.22)}
.btn.off{border-color:var(--line);color:var(--dim);background:rgba(255,255,255,.02)}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;
  color:var(--dim);letter-spacing:1px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(120,180,255,.18);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
@media (max-width:900px){.map{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){header{padding:14px 18px;gap:12px}main{padding:20px 16px 48px}}
@media (max-width:560px){.map{grid-template-columns:1fr}.dlg{padding:16px}h1{font-size:16px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

function roc(iso) {
  const d = new Date(iso + "T00:00:00");
  return `${d.getFullYear() - 1911}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}（${WD[d.getDay()]}）`;
}
function runLabel(r) {
  if (r.date) return roc(r.date);
  if (r.month) { const [y, m] = r.month.split("-"); return `${y - 1911} 年 ${+m} 月（日期未定）`; }
  return "日期未定";
}
const nextRun = c => c.runs.find(r => r.status !== "done");
// 報名連結：班代號 LF320P011 拆成 classid=LF320、department=P、sessions=011
// h 是學院系統端產生的參數，推不出來；這組由 LOLO 提供（2026-10-30），所有班次共用同一組
const APPLY_H = "1368C06D58";
const applyUrl = code => {
  const m = /^(.{5})([A-Za-z])(\d{3})$/.exec(code || "");
  return m ? `https://tisflow.cht.com.tw/tisform/tclass/tclass_apply.jsp?classid=${m[1]}&department=${m[2]}&sessions=${m[3]}&h=${APPLY_H}&nolchk=` : "";
};
const lastRun = c => [...c.runs].reverse().find(r => r.status === "done");
const tagEls = c => [c.isNew ? h("span", { class: "tag new" }, "新開班") : null,
  ...c.tags.map(t => h("span", { class: "tag " + (LV[t] || "g" + Math.max(groupOf(t), 0)) }, t))];

function blk(c) {
  const r = nextRun(c) || lastRun(c);
  const cls = r.status === "done" ? "done" : r.date ? "up" : "tbd";
  const lv = c.tags.find(t => LV[t]);                                   // 顏色與卡片上的標籤都看程度
  const when = r.status === "done" ? "已開班・" + runLabel(r) : runLabel(r);
  return h("button", { class: "blk " + cls + (lv ? " " + LV[lv] : ""), type: "button", onclick: () => openCourse(c.key), "aria-haspopup": "dialog" },
    h("div", { class: "t" }, c.title),
    h("div", { class: "when" }, when, lv ? h("span", { class: "lvtag" }, lv.slice(1)) : null));
}

let who = "";
function matches(c, q) {
  if (who && !c.tags.includes(who)) return false;
  if (!q) return true;
  return (c.title + " " + c.key + " " + c.runs.map(r => r.code).join(" ")).toLowerCase().includes(q);
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = DATA.courses.filter(c => matches(c, q));
  const cols = [...DATA.categories, ""].map((cat, i) => {
    const cs = list.filter(c => c.category === cat)
      .sort((a, b) => lvRank(a) - lvRank(b) || a.order - b.order);   // 先基礎→進階→高級，同程度再依 tags.xlsx 的列順序
    if (!cat && !cs.length) return null;
    return h("div", { class: "col" },
      h("div", { class: "head c" + i }, h("b", {}, cat || "其他課程")),
      cs.length ? cs.map(blk) : h("div", { class: "empty" }, "沒有符合的課程"));
  }).filter(Boolean);
  const map = document.getElementById("map");
  map.style.setProperty("--n", cols.length);   // 「其他課程」沒課時不留空欄
  map.replaceChildren(...cols);
}
const sortKey = r => r.date || (r.month ? r.month + "-99" : "9999");

function openCourse(key) {
  const c = DATA.courses.find(x => x.key === key);
  if (!c) return;
  const s = c.schedule, f = c.scheduleFrom;
  const ar = nextRun(c), au = ar ? applyUrl(ar.code) : "";
  const body = document.getElementById("dbody");
  body.replaceChildren(...[
    h("button", { class: "close", type: "button", "aria-label": "關閉", onclick: () => dlg.close() }, "×"),
    h("h3", { id: "d-title" }, c.title),
    h("div", { class: "note" }, [c.category || "其他課程", c.code5 ? "課程代號 " + c.code5 : ""].filter(Boolean).join("・")),
    h("div", { style: "margin-top:8px" }, tagEls(c)),
    c.goal ? h("div", { class: "sec" }, h("h4", {}, "培訓目標"), h("div", {}, c.goal)) : null,
    c.audience ? h("div", { class: "sec" }, h("h4", {}, "參訓對象"), h("div", {}, c.audience)) : null,
    h("div", { class: "sec" }, h("h4", {}, "開班期別"),
      h("ul", { class: "runs" }, c.runs.map(r => h("li", {}, `${r.code || "（班代號待定）"}　${runLabel(r)}　${r.status === "done" ? "已開班" : "預計開班"}`)))),
    h("div", { class: "sec" },
      h("h4", {}, s ? (f.current ? "本期課表" : `課程內容（參考 ${f.code}・${roc(f.date)}）`) : "課程內容"),
      s ? [h("div", { class: "wrap" }, h("table", { class: "tbl" },
              h("tr", {}, h("th", {}, "日期"), h("th", {}, "時間"), h("th", {}, "單元"), h("th", {}, "講師")),
              s.lessons.map(l => h("tr", {}, h("td", {}, l.date), h("td", {}, l.time), h("td", {}, l.name), h("td", {}, l.teacher))))),
           f.current ? null : h("div", { class: "note", style: "margin-top:6px" }, "※ 這是上一期的內容，本期課表與講師以正式公告為準。")]
        : h("div", { class: "note" }, "課程內容待公告。")),
    h("div", { class: "sec btns" },
      s && s.handout ? h("a", { class: "btn", href: s.handout, target: "_blank", rel: "noopener" }, "📥 學員講義（需公司帳號）") : null,
      au ? h("a", { class: "btn", href: au, target: "_blank", rel: "noopener noreferrer",
                    referrerpolicy: "no-referrer" }, `📝 線上報名（${ar.code}）`)
         : h("span", { class: "btn off" }, "報名開放後會更新")),
  ].filter(Boolean));
  if (location.hash !== "#" + key) history.replaceState(null, "", "#" + key);
  if (!dlg.open) dlg.showModal();
}

const dlg = document.getElementById("dlg");
dlg.addEventListener("close", () => history.replaceState(null, "", location.pathname + location.search));
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

document.getElementById("who").replaceChildren(...[["", "全部"], ["#規設", "規設"], ["#客網", "客網"]].map(([t, label]) =>
  h("button", { class: "chip", type: "button", "aria-pressed": String(t === who), onclick: e => {
    who = t;
    document.querySelectorAll("#who .chip").forEach(b => b.setAttribute("aria-pressed", String(b === e.currentTarget)));
    render();
  } }, label)));
document.getElementById("q").addEventListener("input", render);
document.getElementById("foot").textContent = `資料更新：${DATA.generated}・課程規劃以學院正式公告為準・聯絡導師：李怡菁（LOLO）`;
render();
if (location.hash.length > 1) openCourse(decodeURIComponent(location.hash.slice(1)));
</script>
</body>
</html>
